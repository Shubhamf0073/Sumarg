name: deploy

# Tag a release (v1.2.3) to deploy. Builds happen here, not on the shared server.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Names
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/schoolfleet-backend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image (schoolfleet + migrate)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: com.previa.project=schoolfleet
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: SPA build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          tar -czf "../schoolfleet-web-${TAG}.tgz" -C dist .

      - uses: actions/upload-artifact@v7
        with:
          name: spa
          path: schoolfleet-web-${{ env.TAG }}.tgz
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production          # add required reviewers in repo settings if wanted
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spa

      - name: SSH setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload SPA and deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          USER: ${{ secrets.DEPLOY_USER || 'sfdeploy' }}
          TAG: ${{ github.ref_name }}
        run: |
          scp -P "$PORT" "schoolfleet-web-${TAG}.tgz" "${USER}@${HOST}:/srv/schoolfleet/web/incoming/"
          ssh -p "$PORT" "${USER}@${HOST}" "/srv/schoolfleet/compose/scripts/deploy.sh '${TAG}'"
