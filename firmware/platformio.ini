; Sumarg bus unit firmware (docs/14). PlatformIO, Arduino-ESP32 3.x on ESP-IDF 5 (Arduino as an
; IDF component, so secure boot v2, flash encryption and OTA rollback come from sdkconfig).
;
;   pio test -e native          logic tests on the host (CI gate)
;   pio run  -e sb_proto        HW_REV 0  bench: Waveshare ESP32-S3-SIM7670G-4G + reader + OLED + buzzer on wires
;   pio run  -e sb_c1           HW_REV 1  SB-C1: the Waveshare board on our carrier PCB (first schools)
;   pio run  -e sb_r1           HW_REV 2  SB-R1 integrated board (later) — docs/12
;
; Flashing a real board is blocked by a Claude hook unless the human enables it on that machine (docs/14 §11).

[platformio]
default_envs = native

[common]
build_flags =
  -std=gnu++17
  -Wall -Wextra
  -DFW_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.0          ; fixed-capacity JSON (docs/14 §10)
  vshymanskyy/TinyGSM @ ^0.12.0           ; SIMCom A7670/SIM7670 AT driver (reused from Previa Fleet)
  miguelbalboa/MFRC522 @ ^1.4.11          ; RC522 13.56 MHz reader
  olikraus/U8g2 @ ^2.35.19                ; 0.96" SSD1306 status display

[esp32s3]
platform = espressif32 @ ^6.9.0
framework = arduino, espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags = ${common.build_flags} -DBOARD_HAS_PSRAM
lib_deps = ${common.lib_deps}

[env:sb_proto]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -DHW_REV=0

[env:sb_c1]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -DHW_REV=1

[env:sb_r1]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -DHW_REV=2

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -Werror -DUNIT_TEST
build_src_filter = +<logic/>
test_build_src = yes
